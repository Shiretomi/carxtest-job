name: Build WebApp

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Docker image version"
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./microservices/webapp-helloworld
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/webapp:${{ inputs.version }}