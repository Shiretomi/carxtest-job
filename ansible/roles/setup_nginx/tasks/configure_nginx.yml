---
- name: Enable nginx service
  ansible.builtin.service:
    name: nginx
    enabled: true
    state: started

- name: Add default main nginx.conf
  ansible.builtin.template:
    src: nginx.conf.j2
    dest: /etc/nginx/nginx.conf
    mode: "0644"
  notify: Reload nginx

- name: Add VH config default.conf
  ansible.builtin.template:
    src: default.conf.j2
    dest: /etc/nginx/conf.d/default.conf
    mode: "0644"
  notify: Reload nginx

- name: Add index.html at default VH
  ansible.builtin.template:
    src: index.html.j2
    dest: "{{ setup_nginx_webroot }}/index.html"
    mode: "0644"
