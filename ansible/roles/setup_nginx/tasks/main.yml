---
- name: Setup for Ubuntu
  ansible.builtin.include_tasks: ubuntu_install.yml
  when: ansible_os_family == "Debian"

- name: Setup for Redhat-based
  ansible.builtin.include_tasks: redhat_install.yml
  when: ansible_os_family == "RedHat"

- name: Configure nginx
  ansible.builtin.include_tasks: configure_nginx.yml
